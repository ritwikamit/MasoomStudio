<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E9D2AC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED8B7"/>
      <stop offset="35%" stop-color="#C9A16A"/>
      <stop offset="70%" stop-color="#E5C79E"/>
      <stop offset="100%" stop-color="#A97B48"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Curved paths for text -->
    <!-- Top arc: center 250,250, radius ~165 -->
    <path id="topTextArc" d="M 95,250 A 155,155 0 0,1 405,250" fill="none"/>
    <!-- Bottom arc: center 250,250, radius ~155 -->
    <path id="bottomTextArc" d="M 405,250 A 155,155 0 0,1 95,250" fill="none"/>
  </defs>

  <!-- Transparent background -->

  <!-- Subtle ambient golden aura -->
  <circle cx="250" cy="250" r="190" fill="url(#goldGlow)"/>

  <!-- Concentric & interlaced gold rings -->
  <g id="rings" stroke="url(#goldGradient)" fill="none">
    <circle cx="250" cy="250" r="172" stroke-width="1.3" opacity="0.85"/>
    <ellipse cx="250" cy="249" rx="174" ry="170" stroke-width="0.9" opacity="0.6" transform="rotate(-15 250 250)"/>
    <ellipse cx="250" cy="251" rx="170" ry="175" stroke-width="0.9" opacity="0.6" transform="rotate(25 250 250)"/>
    <circle cx="250" cy="250" r="167" stroke-width="0.75" opacity="0.5"/>
  </g>

  <!-- Golden stardust particles around the perimeter -->
  <g fill="#EED8B7" filter="url(#softGlow)">
    <circle cx="250" cy="78" r="3.2"/>
    <circle cx="288" cy="83" r="2.1"/>
    <circle cx="360" cy="116" r="3.4"/>
    <circle cx="395" cy="155" r="2.2"/>
    <circle cx="423" cy="214" r="3.8"/>
    <circle cx="425" cy="285" r="2.8"/>
    <circle cx="406" cy="335" r="3.2"/>
    <circle cx="366" cy="385" r="2.4"/>
    <circle cx="310" cy="416" r="3.5"/>
    <circle cx="240" cy="423" r="3.2"/>
    <circle cx="185" cy="416" r="2.2"/>
    <circle cx="132" cy="380" r="3.3"/>
    <circle cx="95" cy="330" r="2.4"/>
    <circle cx="78" cy="255" r="3.4"/>
    <circle cx="86" cy="190" r="2.2"/>
    <circle cx="118" cy="135" r="3.2"/>
    <circle cx="178" cy="92" r="3.6"/>

    <!-- Micro shimmer dust -->
    <circle cx="270" cy="75" r="1.2" opacity="0.8"/>
    <circle cx="340" cy="98" r="1.4" opacity="0.9"/>
    <circle cx="412" cy="180" r="1.2" opacity="0.7"/>
    <circle cx="420" cy="305" r="1.4" opacity="0.8"/>
    <circle cx="330" cy="425" r="1.3" opacity="0.9"/>
    <circle cx="160" cy="405" r="1.2" opacity="0.7"/>
    <circle cx="82" cy="225" r="1.3" opacity="0.8"/>
    <circle cx="145" cy="110" r="1.5" opacity="0.8"/>
  </g>

  <!-- Arched Typography: BASED IN INDIA -->
  <text font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="7" fill="#C9A16A">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      BASED IN INDIA
    </textPath>
  </text>

  <!-- Arched Typography: ESTD. 2018 -->
  <text font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="7" fill="#C9A16A">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      ESTD. 2018
    </textPath>
  </text>

  <!-- Central signature script lettering "Masoom Studio" -->
  <g id="signature" transform="translate(0, -4)">
    <!-- Fallback & styled SVG text with high precision -->
    <text x="250" y="272" text-anchor="middle" font-family="'Alex Brush', 'Great Vibes', 'Allura', 'Brush Script MT', cursive" font-size="78" font-weight="400" fill="#FFFFFF" letter-spacing="1" style="text-shadow: 0 0 10px rgba(255,255,255,0.4);">
      Masoom Studio
    </text>
  </g>
</svg>
