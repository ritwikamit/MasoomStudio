<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Masoom Studio</title>
<desc id="desc">Masoom Studio signature wordmark on black with champagne-gold orbit lines and dots. Based in India. Estb. 2018.</desc>
<defs>
<style>
.gold{fill:none;stroke:#C9A16A;stroke-width:2.2}.fine{fill:none;stroke:#B98A54;stroke-width:1.3}
.dot{fill:#D4AE78}.arc{fill:#F7F3EE;font-family:Montserrat,"Avenir Next",Arial,sans-serif;font-size:25px;letter-spacing:11px}
.est{fill:#F7F3EE;font-family:Montserrat,"Avenir Next",Arial,sans-serif;font-size:23px;letter-spacing:10px}
.script{fill:#fff;font-family:"Brittany Signature","Segoe Script","Brush Script MT","URW Chancery L",cursive;font-size:130px;font-weight:400}
</style>
<path id="top" d="M245 454 A255 255 0 0 1 755 454"/>
<path id="bottom" d="M310 640 A205 205 0 0 0 690 640"/>
</defs>
<rect width="1000" height="1000" fill="#050505"/>
<circle cx="500" cy="500" r="254" class="fine" transform="rotate(-8 500 500)"/>
<circle cx="500" cy="500" r="265" class="gold" transform="rotate(7 500 500)"/>
<path d="M235 477 A265 265 0 0 1 739 343 M257 620 A260 260 0 0 0 752 571 M270 382 A260 260 0 0 1 701 274 M297 677 A264 264 0 0 0 729 631" class="fine"/>
<g class="dot">
<circle cx="360" cy="245" r="7"/><circle cx="457" cy="215" r="6"/><circle cx="568" cy="210" r="6"/>
<circle cx="653" cy="237" r="8"/><circle cx="721" cy="316" r="7"/><circle cx="752" cy="405" r="5"/>
<circle cx="713" cy="601" r="7"/><circle cx="637" cy="699" r="6"/><circle cx="532" cy="728" r="6"/>
<circle cx="411" cy="708" r="7"/><circle cx="302" cy="653" r="4"/><circle cx="260" cy="557" r="4"/>
<circle cx="281" cy="341" r="3"/><circle cx="704" cy="670" r="3"/>
</g>
<text class="arc"><textPath href="#top" startOffset="50%" text-anchor="middle">BASED IN INDIA</textPath></text>
<text x="500" y="515" class="script" text-anchor="middle" textLength="630" lengthAdjust="spacingAndGlyphs">Masoom Studio</text>
<text class="est"><textPath href="#bottom" startOffset="50%" text-anchor="middle">ESTB. 2018</textPath></text>
</svg>